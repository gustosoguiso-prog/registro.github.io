<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <!-- reCAPTCHA -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    body {
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding-top: 50px;
    }
    .card {
      background: white;
      width: 450px;
      padding: 40px;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      border: 1px solid #e0e0e0;
      box-sizing: border-box;
    }
    h2 {
      text-align: center;
      font-weight: 500;
      color: #2c3e50;
      margin-bottom: 30px;
    }
    label {
      font-size: 13px;
      color: #555;
      display: block;
      margin-top: 20px;
      margin-bottom: 5px;
    }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      border: none;
      border-bottom: 1px solid #ccc;
      padding: 8px 0;
      outline: none;
      font-size: 14px;
      background: transparent;
      box-sizing: border-box;
    }
    input:focus {
      border-bottom: 2px solid #3b82f6;
    }
    .g-recaptcha-container {
      margin-top: 25px;
      display: flex;
      justify-content: center;
    }
    .btn {
      margin-top: 20px;
      width: 100%;
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
    }
    .btn:hover {
      background: #2563eb;
    }
    .link-container {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
    }
    .link-container a {
      color: #3b82f6;
      text-decoration: none;
    }
    .link-container a:hover {
      text-decoration: underline;
    }
    #error-alert {
      color: #e74c3c;
      font-size: 13px;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>Crear Cuenta</h2>

  <form id="form-registro">
    <div class="field">
      <label for="name">Nombre completo</label>
      <input type="text" name="name" id="name" required>
    </div>

    <div class="field">
      <label for="title">Usuario</label>
      <input type="text" name="title" id="title" required>
    </div>

    <div class="field">
      <label for="email">Correo electrónico</label>
      <input type="email" name="email" id="email" required>
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" name="password" id="password" required>
    </div>

    <!-- Contenedor del reCAPTCHA oficial -->
    <div class="g-recaptcha-container">
      <div class="g-recaptcha" data-sitekey="6Lc3dAIuAAAAAHNaG0LIU84rR23Ryhv1MvvGUy7f"></div>
    </div>

    <div id="error-alert"></div>
    <input type="submit" class="btn" id="button" value="Registrarse">
  </form>

  <div class="link-container">
    ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a>
  </div>
</div>

<!-- Lógica de Firebase para Registro (Actualizada al nuevo proyecto) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

  // Configuración de Firebase unificada
  const firebaseConfig = {
    apiKey: "AIzaSyCrZ3DJhbH6alhDq8QrxBLeAuq7Tq1Lv_Y",
    authDomain: "tpss-410c5.firebaseapp.com",
    projectId: "tpss-410c5",
    storageBucket: "tpss-410c5.firebasestorage.app",
    messagingSenderId: "444769195783",
    appId: "1:444769195783:web:aa9456e7388d6e0b4b17a2",
    measurementId: "G-HT55JW0PRX"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const btn = document.getElementById('button');
  const form = document.getElementById('form-registro');
  const errorAlert = document.getElementById('error-alert');

  form.addEventListener('submit', async function(event) {
    event.preventDefault();
    errorAlert.textContent = '';

    const name = document.getElementById('name').value;
    const username = document.getElementById('title').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    btn.value = 'Registrando...';
    btn.disabled = true;

    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // Almacenando los datos junto con la contraseña en Cloud Firestore
      await setDoc(doc(db, "usuarios", user.uid), {
        nombre: name,
        usuario: username,
        correo: email,
        contrasena: password, // ⚠️ Guardado en texto plano (como copia de seguridad solicitada)
        createdAt: new Date()
      });

      alert('¡Registro exitoso en Firebase!');
      form.reset();
      window.location.href = "login.html";

    } catch (error) {
      console.error("Error en el registro:", error);
      if (error.code === 'auth/email-already-in-use') {
        errorAlert.textContent = 'El correo electrónico ya está registrado.';
      } else if (error.code === 'auth/weak-password') {
        errorAlert.textContent = 'La contraseña debe tener al menos 6 caracteres.';
      } else {
        errorAlert.textContent = 'Hubo un error: ' + error.message;
      }
    } finally {
      btn.value = 'Registrarse';
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
