<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <!-- reCAPTCHA -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    body {
      background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSRYCKT6aDr9V10NTcKnE30KoMYpkoYvPcw1YeiEw1KSAvupwL-apYwdV-v&s=10');
      background-size: cover;         
      background-position: center;    
      background-repeat: no-repeat;   
      background-attachment: fixed;   
      
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding-top: 50px;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .card {
      background: rgba(255, 255, 255, 0.95); 
      width: 450px;
      padding: 40px;
      border-radius: 4px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      border: 1px solid #e0e0e0;
      box-sizing: border-box;
      height: fit-content;
    }

    h2 {
      text-align: center;
      font-weight: 500;
      color: #2c3e50;
      margin-bottom: 30px;
    }

    label {
      font-size: 13px;
      color: #555;
      display: block;
      margin-top: 20px;
      margin-bottom: 5px;
    }

    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      border: none;
      border-bottom: 1px solid #ccc;
      padding: 8px 0;
      outline: none;
      font-size: 14px;
      background: transparent;
      box-sizing: border-box;
    }

    input:focus {
      border-bottom: 2px solid #3b82f6;
    }

    .g-recaptcha-container {
      margin-top: 25px;
      display: flex;
      justify-content: center;
    }

    .btn {
      margin-top: 20px;
      width: 100%;
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
    }

    .btn:hover {
      background: #2563eb;
    }

    .link-container {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
    }

    .link-container a {
      color: #3b82f6;
      text-decoration: none;
    }

    .link-container a:hover {
      text-decoration: underline;
    }

    #error-alert {
      color: #e74c3c;
      font-size: 13px;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>Iniciar Sesión</h2>

  <form id="form">
    <div class="field">
      <label for="email">Correo electrónico o Usuario</label>
      <input type="text" name="email" id="email" required>
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" name="password" id="password" required>
    </div>

    <!-- Contenedor del reCAPTCHA oficial -->
    <div class="g-recaptcha-container">
      <div class="g-recaptcha" data-sitekey="6LeJifotAAAAAOoZi-SOw4AXStn4JoIx1EIQxsTH"></div>
    </div>

    <div id="error-alert"></div>
    <input type="submit" class="btn" id="button" value="Ingresar">
  </form>

  <div class="link-container">
    ¿No tienes una cuenta? <a href="index.html">Regístrate aquí</a>
  </div>
</div>

<!-- Lógica de Firebase con módulos vía CDN unificada (Versión 13.3.0) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-analytics.js";

  // Configuración de Firebase unificada
  const firebaseConfig = {
    apiKey: "AIzaSyCrZ3DJhbH6alhDq8QrxBLeAuq7Tq1Lv_Y",
    authDomain: "tpss-410c5.firebaseapp.com",
    projectId: "tpss-410c5",
    storageBucket: "tpss-410c5.firebasestorage.app",
    messagingSenderId: "444769195783",
    appId: "1:444769195783:web:aa9456e7388d6e0b4b17a2",
    measurementId: "G-HT55JW0PRX"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const analytics = getAnalytics(app);

  const btn = document.getElementById('button');
  const errorAlert = document.getElementById('error-alert');

  document.getElementById('form').addEventListener('submit', async function(event) {
    event.preventDefault();
    errorAlert.textContent = '';
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    btn.value = 'Iniciando sesión...';
    btn.disabled = true;

    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;
      
      alert('¡Inicio de sesión exitoso!');
      
      // Redirección activa a tu panel o dashboard:
      window.location.href = "dashboard.html";
      
    } catch (error) {
      console.error("Error de autenticación:", error.code, error.message);
      
      if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-email') {
        errorAlert.textContent = 'Correo electrónico o contraseña incorrectos.';
      } else if (error.code === 'auth/too-many-requests') {
        errorAlert.textContent = 'Demasiados intentos fallidos. Inténtalo más tarde.';
      } else {
        errorAlert.textContent = 'Ocurrió un error al iniciar sesión. Inténtalo de nuevo.';
      }
    } finally {
      btn.value = 'Ingresar';
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
